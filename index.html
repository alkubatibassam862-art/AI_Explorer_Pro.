<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">
    <meta name="description" content="AI Explorer - اكتشف عالم الذكاء الاصطناعي">
    <title>AI Explorer | معرض تعليمتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #04060b;
            --panel: rgba(13, 18, 32, 0.72);
            --panel-2: rgba(18, 24, 42, 0.86);
            --border: rgba(255, 255, 255, 0.09);
            --text: #f6f8ff;
            --muted: #8993aa;
            --blue: #6d8cff;
            --cyan: #4edcff;
            --purple: #a875ff;
            --green: #5ff0c0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Readex Pro", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% -15%, rgba(83, 102, 255, 0.2), transparent 34%),
                radial-gradient(circle at 5% 55%, rgba(64, 211, 255, 0.06), transparent 28%),
                radial-gradient(circle at 95% 75%, rgba(167, 117, 255, 0.06), transparent 28%),
                var(--bg);
            overflow-x: hidden;
        }

        #neural-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        .page {
            position: relative;
            z-index: 1;
            width: min(1120px, calc(100% - 30px));
            margin: auto;
            padding: 24px 0 45px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 52px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    135deg,
                    rgba(109, 140, 255, 0.3),
                    rgba(78, 220, 255, 0.08)
                );
            border: 1px solid rgba(109, 140, 255, 0.3);
            box-shadow:
                0 0 30px rgba(109, 140, 255, 0.14),
                inset 0 0 18px rgba(255, 255, 255, 0.03);
        }

        .brand-core {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow:
                0 0 10px var(--cyan),
                0 0 25px rgba(78, 220, 255, 0.8);
        }

        .brand strong {
            display: block;
            font-size: 14px;
            font-weight: 600;
        }

        .brand small {
            color: #68738b;
            font-size: 9px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action {
            height: 38px;
            padding: 0 14px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.035);
            color: #cbd3e4;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .action:hover {
            background: rgba(109, 140, 255, 0.1);
            border-color: rgba(109, 140, 255, 0.3);
        }

        .hero {
            text-align: center;
            margin-bottom: 55px;
        }

        .orb-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            position: relative;
            display: grid;
            place-items: center;
        }

        .orb-glow {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(78, 220, 255, 0.35),
                    rgba(109, 140, 255, 0.15) 42%,
                    transparent 72%
                );
            filter: blur(14px);
            animation: pulse 3s ease-in-out infinite;
        }

        .orb-ring {
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            border: 1px solid rgba(109, 140, 255, 0.3);
            box-shadow:
                0 0 35px rgba(109, 140, 255, 0.14),
                inset 0 0 25px rgba(78, 220, 255, 0.08);
            animation: rotate 10s linear infinite;
        }

        .orb-ring::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            top: 9px;
            left: 30px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 14px var(--cyan);
        }

        .orb {
            width: 91px;
            height: 91px;
            position: relative;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 34% 25%,
                    #ecffff 0%,
                    #91eeff 9%,
                    #657fff 33%,
                    #352675 63%,
                    #0a0c18 100%
                );
            box-shadow:
                0 0 25px rgba(78, 220, 255, 0.55),
                0 0 75px rgba(109, 140, 255, 0.34),
                inset -18px -18px 30px rgba(0, 0, 0, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        .orb::before,
        .orb::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .orb::before {
            inset: 15px;
        }

        .orb::after {
            inset: 29px;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .hero-label {
            color: #68758f;
            font-size: 9px;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 49px);
            line-height: 1.3;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .hero h1 span {
            background: linear-gradient(
                90deg,
                #ffffff,
                #8de8ff,
                #a984ff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            width: min(600px, 100%);
            margin: 13px auto 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 2;
        }

        .section-title {
            margin-bottom: 16px;
        }

        .section-title small {
            display: block;
            color: var(--cyan);
            font-size: 8px;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .section-title h2 {
            font-size: 17px;
            font-weight: 500;
        }

        .explore-section {
            margin-bottom: 38px;
        }

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 11px;
        }

        .explore-card {
            min-height: 128px;
            padding: 17px;
            text-align: right;
            border-radius: 18px;
            border: 1px solid var(--border);
            background:
                linear-gradient(
                    145deg,
                    rgba(20, 27, 47, 0.82),
                    rgba(9, 13, 24, 0.7)
                );
            color: white;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .explore-card::before {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            left: -30px;
            bottom: -40px;
            border-radius: 50%;
            background: rgba(109, 140, 255, 0.13);
            filter: blur(15px);
        }

        .explore-card:hover {
            transform: translateY(-5px);
            border-color: rgba(109, 140, 255, 0.4);
            background:
                linear-gradient(
                    145deg,
                    rgba(28, 37, 67, 0.92),
                    rgba(10, 15, 28, 0.82)
                );
        }

        .card-number {
            color: #59657d;
            font-size: 8px;
            margin-bottom: 13px;
        }

        .card-icon {
            width: 33px;
            height: 33px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            margin-bottom: 11px;
            background: rgba(109, 140, 255, 0.1);
            border: 1px solid rgba(109, 140, 255, 0.18);
            color: var(--cyan);
            font-size: 14px;
        }

        .explore-card h3 {
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .explore-card p {
            color: #737e95;
            font-size: 8px;
            line-height: 1.7;
        }

        .journey {
            margin-bottom: 38px;
        }

        .journey-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 11px;
        }

        .step {
            position: relative;
            padding: 19px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: rgba(13, 18, 31, 0.62);
            backdrop-filter: blur(15px);
        }

        .step-number {
            width: 31px;
            height: 31px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            margin-bottom: 12px;
            background: linear-gradient(
                135deg,
                rgba(109, 140, 255, 0.25),
                rgba(168, 117, 255, 0.12)
            );
            border: 1px solid rgba(109, 140, 255, 0.2);
