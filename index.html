<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI World | معرض تعليمتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            /* شفافية فائقة وإطار مضيء وخفيف جداً */
            --glass-bg: rgba(8, 12, 25, 0.25);
            --glass-border: rgba(99, 102, 241, 0.35);
            --primary-glow: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --user-msg: linear-gradient(135deg, rgba(79, 70, 229, 0.85), rgba(147, 51, 234, 0.85));
            --bot-msg: rgba(15, 23, 42, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
        }

        /* السماح بالتمرير الرأسي مع عدم إخفاء الـ 3D */
        html, body {
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* الكانفاس يغطي الشاشة وثابت مع التمرير */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* حاوي العناصر بطول الصفحة */
        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px 40px 20px;
            gap: 30px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 1. المحادثة في الأعلى وتتوسط الشاشة */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 75vh;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(5, 9, 18, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-glow);
            border-color: var(--primary-glow);
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            backdrop-filter: blur(4px);
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background: var(--bot-msg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 4px;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--primary-glow);
            border-color: var(--primary-glow);
        }

        .input-area {
            padding: 16px 20px;
            background: rgba(5, 9, 18, 0.4);
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 12px 18px;
            border-radius: 14px;
            color: #fff;
            outline: none;
            font-size: 0.92rem;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 2. القسم السفلي للكود ومعلومات المعرض */
        .bottom-section {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qr-img {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            background: #fff;
            padding: 5px;
        }

        @media (max-width: 768px) {
            .bottom-section { flex-direction: column; gap: 20px; text-align: center; }
            .brand-info { flex-direction: column; }
            .qr-card { flex-direction: column; }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="page-wrapper">
        <!-- 1. المحادثة أصبحت في الأعلى -->
        <div class="chat-container interactive">
            <div class="chat-header">
                <h3 id="headerTitle" style="font-size: 1rem;">🤖 المساعد الذكي للهندسة والتكنولوجيا</h3>
                <div class="header-actions">
                    <button class="action-btn" onclick="newChat()">🔄 <span id="btnNewChat">محادثة جديدة</span></button>
                    <button class="action-btn" onclick="toggleLanguage()">🌐 <span id="btnLang">English</span></button>
                </div>
            </div>

            <div class="chat-area" id="chatBox">
                <div class="message bot" id="welcomeMsg">أهلاً بك في جناح الذكاء الاصطناعي! 🚀 اسألني عن أي موضوع وستجد إجابة فورية.</div>
            </div>

            <div class="suggestions" id="suggestionsBox"></div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleKey(event)">
                <button class="send-btn" id="sendBtnText" onclick="sendMessage()">إرسال</button>
            </div>
        </div>

        <!-- 2. الكود والمعلومات أصبحت في الأسفل عند التمرير -->
        <div class="bottom-section interactive">
            <div class="brand-info">
                <div class="brand-badge">3D</div>
                <div>
                    <h2 id="sbTitle">معرض تعليمتي</h2>
                    <p id="sbSub" style="color: var(--text-muted); font-size: 0.85rem;">جناح هندسة الذكاء الاصطناعي</p>
                    <p id="sbFooter" style="font-size: 0.75rem; color: #a5b4fc; margin-top: 5px;">حرك الماوس لتتدفق الأشكال الـ 3D ✨</p>
                </div>
            </div>

            <div class="qr-card">
                <img src="/qr" alt="QR Code" class="qr-img">
                <p id="qrTxt" style="font-size: 0.8rem; color: #c7d2fe; max-width: 140px;">امسح الكود لفتح المحادثة عبر الجوال 📱</p>
            </div>
        </div>
    </div>

    <!-- 3D Engine Script -->
    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020408, 0.01);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // إضاءة قوية لتوضيح الأشكال
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x6366f1, 6, 100);
        pointLight1.position.set(25, 25, 25);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x06b6d4, 6, 100);
        pointLight2.position.set(-25, -25, 25);
        scene.add(pointLight2);

        // إنشاء أشكال 3D كبيرة وواضحة
        const shapes = [];
        const geometries = [
            new THREE.IcosahedronGeometry(2.2, 0),
            new THREE.TorusGeometry(1.8, 0.5, 16, 100),
            new THREE.BoxGeometry(2.2, 2.2, 2.2),
            new THREE.SphereGeometry(1.8, 32, 32),
            new THREE.OctahedronGeometry(2.0, 0),
            new THREE.TorusKnotGeometry(1.4, 0.4, 100, 16)
        ];

        for (let i = 0; i < 70; i++) {
            const randomGeo = geometries[Math.floor(Math.random() * geometries.length)];
            const color = Math.random() > 0.5 ? 0x6366f1 : (Math.random() > 0.5 ? 0x06b6d4 : 0xa855f7);
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.1,
                metalness: 0.8,
                wireframe: Math.random() > 0.45
            });

            const mesh = new THREE.Mesh(randomGeo, material);
            mesh.position.x = (Math.random() - 0.5) * 60;
            mesh.position.y = (Math.random() - 0.5) * 60;
            mesh.position.z = (Math.random() - 0.5) * 45;

            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;

            const scale = Math.random() * 1.3 + 0.8;
            mesh.scale.set(scale, scale, scale);

            mesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.015,
                rotSpeedY: (Math.random() - 0.5) * 0.015,
                floatSpeed: Math.random() * 0.008 + 0.004
            };

            shapes.push(mesh);
            scene.add(mesh);
        }

        // جزيئات الفضاء
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 120;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.18, color: 0x38bdf8, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach(shape => {
                shape.rotation.x += shape.userData.rotSpeedX;
                shape.rotation.y += shape.userData.rotSpeedY;
                shape.position.y += Math.sin(Date.now() * shape.userData.floatSpeed) * 0.015;
            });
            particlesMesh.rotation.y = Date.now() * 0.0001;
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Chat & Multi-language Logic
        let chatHistory = [];
        let currentLang = 'ar';

        const translations = {
            ar: {
                sbTitle: "معرض تعليمتي",
                sbSub: "جناح هندسة الذكاء الاصطناعي",
                qrTxt: "امسح الكود لفتح المحادثة عبر الجوال 📱",
                sbFooter: "حرك الماوس لتتدفق الأشكال الـ 3D ✨",
                headerTitle: "🤖 المساعد الذكي للهندسة والتكنولوجيا",
                btnNewChat: "محادثة جديدة",
                btnLang: "English",
                welcomeMsg: "أهلاً بك في جناح الذكاء الاصطناعي! 🚀 اسألني عن أي موضوع وستجد إجابة فورية.",
                inputPh: "اكتب سؤالك هنا...",
                sendBtn: "إرسال",
                thinking: "جاري التفكير...",
                errConnection: "حدث خطأ في الاتصال.",
                suggestions: [
                    { label: "ما هو الذكاء الاصطناعي؟", text: "ما هو الذكاء الاصطناعي ببساطة؟" },
                    { label: "هل يستبدل الوظائف؟", text: "هل يستبدل الذكاء الاصطناعي الوظائف؟" },
                    { label: "الفرق بين AI و ML", text: "ما الفرق بين AI و ML؟" },
                    { label: "كيف أبدأ التعلم؟", text: "كيف أبدأ تعلم البرمجة والذكاء الاصطناعي؟" }
                ]
            },
            en: {
                sbTitle: "Talimati Exhibition",
                sbSub: "AI Engineering Pavilion",
                qrTxt: "Scan QR code to chat on mobile 📱",
                sbFooter: "Move mouse to float 3D shapes ✨",
                headerTitle: "🤖 AI Smart Assistant",
                btnNewChat: "New Chat",
                btnLang: "العربية",
                welcomeMsg: "Welcome to the AI Pavilion! 🚀 Ask me anything about technology or programming.",
                inputPh: "Type your question here...",
                sendBtn: "Send",
                thinking: "Thinking...",
                errConnection: "Connection error.",
                suggestions: [
                    { label: "What is AI?", text: "What is Artificial Intelligence in simple terms?" },
                    { label: "Will AI replace jobs?", text: "Will AI replace human jobs?" },
                    { label: "AI vs Machine Learning", text: "What is the difference between AI and ML?" },
                    { label: "How to start learning?", text: "How can I start learning programming and AI?" }
                ]
            }
        };

        function renderUI() {
            const t = translations[currentLang];
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.getElementById('sbTitle').innerText = t.sbTitle;
            document.getElementById('sbSub').innerText = t.sbSub;
            document.getElementById('qrTxt').innerText = t.qrTxt;
            document.getElementById('sbFooter').innerText = t.sbFooter;
            document.getElementById('headerTitle').innerText = t.headerTitle;
            document.getElementById('btnNewChat').innerText = t.btnNewChat;
            document.getElementById('btnLang').innerText = t.btnLang;
            document.getElementById('userInput').placeholder = t.inputPh;
            document.getElementById('sendBtnText').innerText = t.sendBtn;

            const sugContainer = document.getElementById('suggestionsBox');
            sugContainer.innerHTML = '';
            t.suggestions.forEach(s => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = s.label;
                chip.onclick = () => sendPrompt(s.text);
                sugContainer.appendChild(chip);
            });
        }

        function newChat() {
            chatHistory = [];
            const chatBox = document.getElementById('chatBox');
            const t = translations[currentLang];
            chatBox.innerHTML = `<div class="message bot">${t.welcomeMsg}</div>`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            renderUI();
            newChat();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            chatHistory.push({ role: 'user', content: text });
            const t = translations[currentLang];
            const botMsgDiv = addMessage(t.thinking, 'bot');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, language: currentLang })
                });

                const data = await response.json();
                let answer = data.answer || 'Error';
                answer = answer.replace(/[#*|_]/g, '');

                botMsgDiv.innerText = answer;
                chatHistory.push({ role: 'assistant', content: answer });
            } catch (err) {
                botMsgDiv.innerText = t.errConnection;
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function sendPrompt(promptText) {
            document.getElementById('userInput').value = promptText;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        renderUI();
    </script>
</body>
</html>
