<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Neural Network | معرض تعليمتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            /* تصميم زجاجي شفاف جداً متناسق مع النيون الأزرق والأرجواني */
            --glass-bg: rgba(6, 11, 25, 0.4);
            --glass-border: rgba(56, 189, 248, 0.35);
            --primary-glow: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: linear-gradient(135deg, rgba(79, 70, 229, 0.85), rgba(147, 51, 234, 0.85));
            --bot-msg: rgba(15, 23, 42, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
        }

        html, body {
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* خلفية الـ Canvas ثلاثية الأبعاد ثابتة بالكامل */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 25px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 1. نافذة المحادثة الرئيسة */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 72vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(5, 9, 20, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-glow);
            border-color: var(--primary-glow);
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            backdrop-filter: blur(4px);
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background: var(--bot-msg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 4px;
        }

        /* الأسئلة المقترحة */
        .suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #000;
            font-weight: 600;
        }

        .input-area {
            padding: 14px 20px;
            background: rgba(5, 9, 20, 0.5);
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 2. قسم الـ QR والمعلومات السفلي */
        .bottom-section {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-badge {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qr-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
        }

        @media (max-width: 768px) {
            .bottom-section { flex-direction: column; gap: 15px; text-align: center; }
            .brand-info { flex-direction: column; }
            .qr-card { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- الكانفاس الخاص بالشبكة العصبية الـ 3D -->
    <canvas id="webgl-canvas"></canvas>

    <div class="page-wrapper">
        <!-- المحادثة والأسئلة المقترحة -->
        <div class="chat-container interactive">
            <div class="chat-header">
                <h3 id="headerTitle" style="font-size: 1rem;">🤖 المساعد الذكي للهندسة والتكنولوجيا</h3>
                <div class="header-actions">
                    <button class="action-btn" onclick="newChat()">🔄 <span id="btnNewChat">محادثة جديدة</span></button>
                    <button class="action-btn" onclick="toggleLanguage()">🌐 <span id="btnLang">English</span></button>
                </div>
            </div>

            <div class="chat-area" id="chatBox">
                <div class="message bot" id="welcomeMsg">أهلاً بك في جناح الذكاء الاصطناعي! 🚀 اسألني عن أي موضوع وستجد إجابة فورية.</div>
            </div>

            <!-- الأسئلة المقترحة -->
            <div class="suggestions" id="suggestionsBox"></div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleKey(event)">
                <button class="send-btn" id="sendBtnText" onclick="sendMessage()">إرسال</button>
            </div>
        </div>

        <!-- الجزء السفلي ومعلومات المعرض -->
        <div class="bottom-section interactive">
            <div class="brand-info">
                <div class="brand-badge">AI</div>
                <div>
                    <h2 id="sbTitle">معرض تعليمتي</h2>
                    <p id="sbSub" style="color: var(--text-muted); font-size: 0.85rem;">جناح هندسة الذكاء الاصطناعي</p>
                    <p id="sbFooter" style="font-size: 0.75rem; color: #38bdf8; margin-top: 4px;">شبكة عصبية تفاعلية ✨</p>
                </div>
            </div>

            <div class="qr-card">
                <img src="/qr" alt="QR Code" class="qr-img">
                <p id="qrTxt" style="font-size: 0.78rem; color: #c7d2fe; max-width: 130px;">امسح الكود لفتح المحادثة عبر الجوال 📱</p>
            </div>
        </div>
    </div>

    <!-- كود الـ 3D للشبكة العصبية والخلايا المتصلة -->
    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020408, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. بناء عقد خلايا الذكاء الاصطناعي (Neural Nodes)
        const nodesCount = 120;
        const nodesPositions = [];
        const nodesGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(nodesCount * 3);
        const velocities = [];

        for (let i = 0; i < nodesCount; i++) {
            const x = (Math.random() - 0.5) * 70;
            const y = (Math.random() - 0.5) * 70;
            const z = (Math.random() - 0.5) * 50;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            nodesPositions.push(new THREE.Vector3(x, y, z));
            velocities.push(new THREE.Vector3(
                (Math.random() - 0.5) * 0.03,
                (Math.random() - 0.5) * 0.03,
                (Math.random() - 0.5) * 0.03
            ));
        }

        nodesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // خامة النطاق النجمي/العصبوني
        const nodeMaterial = new THREE.PointsMaterial({
            color: 0x06b6d4,
            size: 0.7,
            transparent: true,
            opacity: 0.9
        });

        const nodePoints = new THREE.Points(nodesGeometry, nodeMaterial);
        scene.add(nodePoints);

        // 2. بناء الألياف/الروابط العصبية المتصلة بين العقد (Synapses)
        const linesMaterial = new THREE.LineBasicMaterial({
            color: 0x6366f1,
            transparent: true,
            opacity: 0.25
        });

        const linesGeometry = new THREE.BufferGeometry();
        const linesMesh = new THREE.LineSegments(linesGeometry, linesMaterial);
        scene.add(linesMesh);

        // 3. التفاعل مع الماوس
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // 4. حلقة التحريك والتحديث المستمر للشبكة العصبية
        function animate() {
            requestAnimationFrame(animate);

            const posArray = nodePoints.geometry.attributes.position.array;
            const linePositions = [];

            // تحريك العقد وتحديث مواضعها
            for (let i = 0; i < nodesCount; i++) {
                nodesPositions[i].add(velocities[i]);

                // إعادة العقدة إن خرجت عن نطاق الشاشة
                if (Math.abs(nodesPositions[i].x) > 35) velocities[i].x *= -1;
                if (Math.abs(nodesPositions[i].y) > 35) velocities[i].y *= -1;
                if (Math.abs(nodesPositions[i].z) > 25) velocities[i].z *= -1;

                posArray[i * 3] = nodesPositions[i].x;
                posArray[i * 3 + 1] = nodesPositions[i].y;
                posArray[i * 3 + 2] = nodesPositions[i].z;
            }

            nodePoints.geometry.attributes.position.needsUpdate = true;

            // حساب المسافات ورسم الخطوط/الوصلات العصبية بين القريبة منها
            for (let i = 0; i < nodesCount; i++) {
                for (let j = i + 1; j < nodesCount; j++) {
                    const dist = nodesPositions[i].distanceTo(nodesPositions[j]);
                    if (dist < 12) { // أطول مسافة لربط الخلية العصبية بالتي تجاورها
                        linePositions.push(
                            nodesPositions[i].x, nodesPositions[i].y, nodesPositions[i].z,
                            nodesPositions[j].x, nodesPositions[j].y, nodesPositions[j].z
                        );
                    }
                }
            }

            linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

            // دوران الكاميرا مع الماوس بسلاسة
            camera.position.x += (mouseX * 8 - camera.position.x) * 0.04;
            camera.position.y += (-mouseY * 8 - camera.position.y) * 0.04;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. منطق المحادثة وتعدد اللغات
        let chatHistory = [];
        let currentLang = 'ar';

        const translations = {
            ar: {
                sbTitle: "معرض تعليمتي",
                sbSub: "جناح هندسة الذكاء الاصطناعي",
                qrTxt: "امسح الكود لفتح المحادثة عبر الجوال 📱",
                sbFooter: "شبكة عصبية تفاعلية ✨",
                headerTitle: "🤖 المساعد الذكي للهندسة والتكنولوجيا",
                btnNewChat: "محادثة جديدة",
                btnLang: "English",
                welcomeMsg: "أهلاً بك في جناح الذكاء الاصطناعي! 🚀 اسألني عن أي موضوع وستجد إجابة فورية.",
                inputPh: "اكتب سؤالك هنا...",
                sendBtn: "إرسال",
                thinking: "جاري التفكير...",
                errConnection: "حدث خطأ في الاتصال.",
                suggestions: [
                    { label: "ما هو الذكاء الاصطناعي؟", text: "ما هو الذكاء الاصطناعي ببساطة؟" },
                    { label: "هل يستبدل الوظائف؟", text: "هل يستبدل الذكاء الاصطناعي الوظائف؟" },
                    { label: "الفرق بين AI و ML", text: "ما الفرق بين AI و ML؟" },
                    { label: "كيف أبدأ التعلم؟", text: "كيف أبدأ تعلم البرمجة والذكاء الاصطناعي؟" }
                ]
            },
            en: {
                sbTitle: "Talimati Exhibition",
                sbSub: "AI Engineering Pavilion",
                qrTxt: "Scan QR code to chat on mobile 📱",
                sbFooter: "Interactive Neural Network ✨",
                headerTitle: "🤖 AI Smart Assistant",
                btnNewChat: "New Chat",
                btnLang: "العربية",
                welcomeMsg: "Welcome to the AI Pavilion! 🚀 Ask me anything about technology or programming.",
                inputPh: "Type your question here...",
                sendBtn: "Send",
                thinking: "Thinking...",
                errConnection: "Connection error.",
                suggestions: [
                    { label: "What is AI?", text: "What is Artificial Intelligence in simple terms?" },
                    { label: "Will AI replace jobs?", text: "Will AI replace human jobs?" },
                    { label: "AI vs Machine Learning", text: "What is the difference between AI and ML?" },
                    { label: "How to start learning?", text: "How can I start learning programming and AI?" }
                ]
            }
        };

        function renderUI() {
            const t = translations[currentLang];
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.getElementById('sbTitle').innerText = t.sbTitle;
            document.getElementById('sbSub').innerText = t.sbSub;
            document.getElementById('qrTxt').innerText = t.qrTxt;
            document.getElementById('sbFooter').innerText = t.sbFooter;
            document.getElementById('headerTitle').innerText = t.headerTitle;
            document.getElementById('btnNewChat').innerText = t.btnNewChat;
            document.getElementById('btnLang').innerText = t.btnLang;
            document.getElementById('userInput').placeholder = t.inputPh;
            document.getElementById('sendBtnText').innerText = t.sendBtn;

            const sugContainer = document.getElementById('suggestionsBox');
            sugContainer.innerHTML = '';
            t.suggestions.forEach(s => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = s.label;
                chip.onclick = () => sendPrompt(s.text);
                sugContainer.appendChild(chip);
            });
        }

        function newChat() {
            chatHistory = [];
            const chatBox = document.getElementById('chatBox');
            const t = translations[currentLang];
            chatBox.innerHTML = `<div class="message bot">${t.welcomeMsg}</div>`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            renderUI();
            newChat();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            chatHistory.push({ role: 'user', content: text });
            const t = translations[currentLang];
            const botMsgDiv = addMessage(t.thinking, 'bot');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, language: currentLang })
                });

                const data = await response.json();
                let answer = data.answer || 'Error';
                answer = answer.replace(/[#*|_]/g, '');

                botMsgDiv.innerText = answer;
                chatHistory.push({ role: 'assistant', content: answer });
            } catch (err) {
                botMsgDiv.innerText = t.errConnection;
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function sendPrompt(promptText) {
            document.getElementById('userInput').value = promptText;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        renderUI();
    </script>
</body>
</html>
