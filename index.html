<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI World | معرض تعليمتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة Three.js لتصاميم الـ 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(13, 20, 36, 0.65);
            --glass-border: rgba(99, 102, 241, 0.35);
            --primary-glow: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: #030508;
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* الكانفاس الخاص بالـ 3D خلف كل العناصر */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* واجهة المستخدم الزجاجية فوق الـ 3D */
        .app-layout {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            padding: 20px;
            pointer-events: none; /* يسمح بالتفاعل مع الـ 3D في الخلفية */
        }

        .interactive {
            pointer-events: auto; /* تفعيل التفاعل مع البطاقات والأزرار */
        }

        /* Sidebar Styling */
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .brand-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-img {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            background: #fff;
            padding: 8px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        /* Chat Window */
        .chat-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .chat-header {
            padding: 18px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 13, 24, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .message.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
            background: rgba(26, 35, 58, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 18px 25px;
            background: rgba(8, 13, 24, 0.6);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: 14px;
            color: #fff;
            outline: none;
        }

        .send-btn, .action-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <!-- الكانفاس المسؤول عن رندر الأشكال الـ 3D -->
    <canvas id="webgl-canvas"></canvas>

    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar interactive">
            <div>
                <div class="brand-badge">3D</div>
                <h2>معرض تعليمتي</h2>
                <p style="font-size: 0.8rem; color: var(--text-muted);">عالم الذكاء الاصطناعي التفاعلي</p>
            </div>

            <div class="qr-card">
                <img src="/qr" alt="QR Code" class="qr-img">
                <p style="font-size: 0.8rem; color: #c7d2fe;">امسح الكود لفتح الشات عبر الجوال 📱</p>
            </div>

            <div style="font-size: 0.75rem; color: var(--text-muted);">حرك الماوس لتتدفق الأشكال الـ 3D ✨</div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container interactive">
            <div class="chat-header">
                <h3>🤖 المساعد الذكي ثلاثي الأبعاد</h3>
                <div>
                    <button class="action-btn" onclick="newChat()" style="padding: 8px 14px; font-size: 0.8rem;">🔄 محادثة جديدة</button>
                </div>
            </div>

            <div class="chat-area" id="chatBox">
                <div class="message bot">أهلاً بك! استمتع بالتصميم الـ 3D التفاعلي في الخلفية واسألني عن أي شيء! 🚀</div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- 3D Engine Script using Three.js -->
    <script>
        // 1. Scene, Camera, Renderer Setup
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030508, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 2. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x6366f1, 3, 100);
        pointLight1.position.set(20, 20, 20);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x06b6d4, 3, 100);
        pointLight2.position.set(-20, -20, 20);
        scene.add(pointLight2);

        // 3. Creating Multiple 3D Geometries
        const shapes = [];
        const geometries = [
            new THREE.IcosahedronGeometry(1.2, 0),    // مجسم متعدد الأوجه
            new THREE.TorusGeometry(1, 0.3, 16, 100),   // حلقة دونات
            new THREE.BoxGeometry(1.5, 1.5, 1.5),       // مكعب
            new THREE.SphereGeometry(1, 32, 32),        // كرة
            new THREE.OctahedronGeometry(1.2, 0),      // هرمي مزدوج
            new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16) // عقدة ثلاثية الأبعاد
        ];

        // مواد بصرية براقة مع الشبكات (Wireframe & Wireframe Glow)
        for (let i = 0; i < 70; i++) {
            const randomGeo = geometries[Math.floor(Math.random() * geometries.length)];
            const color = Math.random() > 0.5 ? 0x6366f1 : (Math.random() > 0.5 ? 0x06b6d4 : 0xa855f7);
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.2,
                metalness: 0.8,
                wireframe: Math.random() > 0.6 // بعض الأشكال تكون هيكلية شفافة
            });

            const mesh = new THREE.Mesh(randomGeo, material);

            // توزيع الأشكال عشوائياً في الفضاء 3D
            mesh.position.x = (Math.random() - 0.5) * 60;
            mesh.position.y = (Math.random() - 0.5) * 60;
            mesh.position.z = (Math.random() - 0.5) * 50;

            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;

            const scale = Math.random() * 1.5 + 0.5;
            mesh.scale.set(scale, scale, scale);

            // سرعات دوران مختلفة لكل شكل
            mesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.02,
                rotSpeedY: (Math.random() - 0.5) * 0.02,
                floatSpeed: Math.random() * 0.01 + 0.005
            };

            shapes.push(mesh);
            scene.add(mesh);
        }

        // 4. Background Starfield / Particles (جزيئات مشعة)
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 800;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 120;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.15,
            color: 0xa855f7,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // 5. Mouse Interaction Effect
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // تحريك كل شكل 3D حول نفسه
            shapes.forEach(shape => {
                shape.rotation.x += shape.userData.rotSpeedX;
                shape.rotation.y += shape.userData.rotSpeedY;
                shape.position.y += Math.sin(Date.now() * shape.userData.floatSpeed) * 0.02;
            });

            // تحريك جزيئات خلفية الكاميرا مع الماوس
            particlesMesh.rotation.y = Date.now() * 0.0001;
            
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        // Adjust Canvas on Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Chat Functions
        let chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            chatHistory.push({ role: 'user', content: text });
            const botMsgDiv = addMessage('جاري التفكير...', 'bot');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, language: 'ar' })
                });

                const data = await response.json();
                let answer = data.answer || 'حدث خطأ.';
                answer = answer.replace(/[#*|_]/g, '');

                botMsgDiv.innerText = answer;
                chatHistory.push({ role: 'assistant', content: answer });
            } catch (err) {
                botMsgDiv.innerText = 'خطأ في الاتصال.';
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function newChat() {
            chatHistory = [];
            document.getElementById('chatBox').innerHTML = '<div class="message bot">تم بدء محادثة جديدة! كيف يمكنني مساعدتك؟</div>';
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
