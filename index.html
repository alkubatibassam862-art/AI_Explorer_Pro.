<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Explorer | تجربة الذكاء الاصطناعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b16;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-mark {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #000;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-shell {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 400px;
        }

        .messages {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user-message {
            background: var(--accent-purple);
            color: #fff;
            align-self: flex-start;
        }

        .assistant-message {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            align-self: flex-end;
        }

        .composer {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button.send-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.send-button:hover { opacity: 0.9; }

        .quick-prompts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-prompts button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .quick-prompts button:hover {
            color: var(--text-main);
            border-color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a class="brand" href="/">
                <span class="brand-mark">AI</span>
                <strong>AI EXPLORER</strong>
            </a>
            <span style="color: var(--text-muted); font-size: 0.9rem;">معرض الذكاء الاصطناعي</span>
        </header>

        <section class="hero">
            <h1>اسأل الذكاء الاصطناعي. افهم المستقبل.</h1>
            <p style="color: var(--text-muted);">منصة تفاعلية للإجابة عن أسئلة هندسة الذكاء الاصطناعي والتقنية.</p>
        </section>

        <section class="chat-shell">
            <div class="messages" id="messages">
                <div class="message assistant-message">
                    مرحباً بك! أنا مساعد الذكاء الاصطناعي، كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>

            <div class="quick-prompts">
                <button onclick="sendQuick('ما هو الذكاء الاصطناعي؟')">ما هو الذكاء الاصطناعي؟</button>
                <button onclick="sendQuick('ما الفرق بين AI و Machine Learning؟')">AI vs ML</button>
                <button onclick="sendQuick('كيف أبدأ في هندسة الذكاء الاصطناعي؟')">كيف أبدأ؟</button>
            </div>

            <form class="composer" id="composer">
                <input id="messageInput" autocomplete="off" placeholder="اكتب سؤالك هنا..." maxlength="4000">
                <button type="submit" class="send-button">إرسال</button>
            </form>
        </section>
    </div>

    <script>
        const messages = document.getElementById("messages");
        const composer = document.getElementById("composer");
        const messageInput = document.getElementById("messageInput");
        let chatHistory = [];

        composer.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                sendMessage(text);
                messageInput.value = "";
            }
        });

        function sendQuick(text) {
            sendMessage(text);
        }

        async function sendMessage(text) {
            appendMessage("user", text);
            chatHistory.push({ role: "user", content: text });

            const loadingId = appendMessage("assistant", "جاري التفكير...");

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: chatHistory, language: "ar" })
                });
                const data = await res.json();
                const loadingEl = document.getElementById(loadingId);

                if (data.answer) {
                    loadingEl.textContent = data.answer;
                    chatHistory.push({ role: "assistant", content: data.answer });
                } else {
                    loadingEl.textContent = "حدث خطأ: " + (data.error || "تعذر الحصول على إجابة");
                }
            } catch (err) {
                document.getElementById(loadingId).textContent = "فشل الاتصال بالخادم.";
            }
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement("div");
            const id = "msg-" + Date.now();
            msgDiv.id = id;
            msgDiv.className = `message ${role}-message`;
            msgDiv.textContent = content;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
            return id;
        }
    </script>

</body>
</html>
