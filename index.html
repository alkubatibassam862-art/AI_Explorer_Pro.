<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineering Assistant | مساعد هندسة الذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(18, 26, 43, 0.65);
            --border-color: rgba(99, 102, 241, 0.25);
            --primary-glow: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: linear-gradient(135deg, #4f46e5, #7c3aed);
            --bot-msg: rgba(30, 41, 59, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            padding: 20px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 26, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            font-weight: bold;
            font-size: 20px;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .chat-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .message.bot {
            align-self: flex-end;
            background: var(--bot-msg);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 25px;
            background: rgba(8, 12, 20, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--primary-glow);
            color: #fff;
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        .input-area {
            padding: 20px 25px;
            background: rgba(10, 15, 26, 0.6);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-area input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="brand">
                <div class="brand-logo">AI</div>
                <div class="brand-text">
                    <h1>مساعد هندسة الذكاء الاصطناعي</h1>
                    <p>معرض تعليمتي التفاعلي</p>
                </div>
            </div>
        </div>

        <div class="chat-area" id="chatBox">
            <div class="message bot">
                مرحباً بك! أنا مساعدك الذكي في معرض تعليمتي. اسألني عن الذكاء الاصطناعي، تعلم الآلة، أو كيف تبدأ في هذا المجال! ✨
            </div>
        </div>

        <div class="suggestions">
            <div class="chip" onclick="sendPrompt('ما هو الذكاء الاصطناعي ببساطة؟')">ما هو الذكاء الاصطناعي؟</div>
            <div class="chip" onclick="sendPrompt('هل يستبدل AI الوظائف؟')">هل يستبدل الوظائف؟</div>
            <div class="chip" onclick="sendPrompt('ما الفرق بين AI و ML و DL؟')">الفرق بين AI و ML</div>
            <div class="chip" onclick="sendPrompt('كيف ابدأ اتعلم ذكاء اصطناعي؟')">كيف أبدأ التعلم؟</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل أي شيء... (حتى لو مع أخطاء إملائية)" onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            chatHistory.push({ role: 'user', content: text });

            const botMsgDiv = addMessage('جاري التفكير...', 'bot');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, language: 'ar' })
                });

                const data = await response.json();
                let answer = data.answer || 'عذراً، حدث خطأ.';
                
                // تنظيف النص من أي رموز Markdown تشوه الشكل
                answer = answer.replace(/[#*|_]/g, '');

                botMsgDiv.innerText = answer;
                chatHistory.push({ role: 'assistant', content: answer });
            } catch (err) {
                botMsgDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function sendPrompt(promptText) {
            document.getElementById('userInput').value = promptText;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
